[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Librerías requeridas
lib_deps =
    ESP8266WiFi
    ESP8266WebServer
    DNSServer
    ESP8266mDNS
    EEPROM

; Definiciones de compilador
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=c++17

; Monitor serie
monitor_filters = time, log2file
