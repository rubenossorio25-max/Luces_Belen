[env:esp32doit]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Librerías requeridas
lib_deps =
    EEPROM
    ArduinoJson@^6.21.0

; Definiciones de compilador para ESP32
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=c++17

; Monitor serie
monitor_filters = time, log2file
